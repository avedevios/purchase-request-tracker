<!DOCTYPE html>
<html lang="en" data-theme="light" data-user="Anton">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Request Issue Tracker & Board</title>
  
  <!-- Modern Typography from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Modular CSS Design System -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Full Screen Animations Canvas -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- Notification Toast Banner -->
  <div id="toast">
    <span id="toastIcon">✨</span>
    <span id="toastMessage">Welcome to Purchase Request Issue Tracker!</span>
    <button class="toast-close-btn" id="closeToastBtn" title="Dismiss notification">&times;</button>
  </div>

  <div class="container">
    
    <!-- Header -->
    <header>
      <div class="title-area">
        <h1>
          Purchase Request Tracker
          <span class="duty-badge" id="dutyUserBadge" title="Current On-Duty User">
            <span class="duty-badge-dot"></span>
            <span id="dutyUserText">ANTON ON DUTY</span>
          </span>
        </h1>
      </div>

      <div class="header-actions">
        <!-- Segmented User Switcher -->
        <div class="user-switcher-group" title="Switch On-Duty User">
          <button class="user-btn active" data-user="Anton">ANTON</button>
          <button class="user-btn" data-user="Adonis">ADONIS</button>
        </div>

        <!-- Fold / Unfold All Groups -->
        <button class="btn" id="foldToggleBtn" title="Fold All Groups">
          <span id="foldToggleSvg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
          </span>
        </button>


        <!-- View Switcher -->
        <div class="view-toggle">
          <button class="view-btn active" id="tableViewBtn" title="Table View">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <button class="view-btn" id="kanbanViewBtn" title="Kanban Board View">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"></rect><rect x="14" y="3" width="7" height="10" rx="1"></rect></svg>
          </button>
        </div>

        <!-- Database Settings -->
        <button class="btn" id="dbSettingsBtn" title="Database Sync Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
        </button>

        <!-- Theme Toggle -->
        <button class="btn" id="themeToggleBtn" title="Switch Theme">
          <span id="themeToggleSvg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          </span>
        </button>

        <!-- Export -->
        <button class="btn btn-primary" id="exportBtn" title="Export JSON Dataset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>
      </div>
    </header>

    <!-- Stats Filter Cards -->
    <div class="stats-grid">
      <div class="stat-card active" data-filter="ALL" title="Click to show all items">
        <div class="stat-icon" style="background: var(--bg-subtle); color: var(--text-main);">📋</div>
        <div class="stat-info">
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">Total Requests</div>
        </div>
      </div>
      <div class="stat-card" data-filter="Fixed" title="Click to filter by Fixed">
        <div class="stat-icon" style="background: var(--status-fixed-bg); color: var(--status-fixed-text);">✅</div>
        <div class="stat-info">
          <div class="stat-value" id="statFixed">0</div>
          <div class="stat-label">Fixed</div>
        </div>
      </div>
      <div class="stat-card" data-filter="To Do" title="Click to filter by To Do">
        <div class="stat-icon" style="background: var(--status-todo-bg); color: var(--status-todo-text);">⏳</div>
        <div class="stat-info">
          <div class="stat-value" id="statTodo">0</div>
          <div class="stat-label">To Do</div>
        </div>
      </div>
      <div class="stat-card" data-filter="Backlog" title="Click to filter by Backlog">
        <div class="stat-icon" style="background: var(--status-backlog-bg); color: var(--status-backlog-text);">📁</div>
        <div class="stat-info">
          <div class="stat-value" id="statBacklog">0</div>
          <div class="stat-label">Backlog</div>
        </div>
      </div>
      <div class="stat-card" data-filter="Deprecated" title="Click to filter by Deprecated">
        <div class="stat-icon" style="background: var(--status-deprecated-bg); color: var(--status-deprecated-text);">🗑️</div>
        <div class="stat-info">
          <div class="stat-value" id="statDeprecated">0</div>
          <div class="stat-label">Deprecated</div>
        </div>
      </div>
    </div>

    <!-- Table View -->
    <div id="tableView" class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 105px;">Status</th>
            <th style="width: 95px;">Where Ball</th>
            <th style="width: 95px;">Priority</th>
            <th style="width: 80px;">Role</th>
            <th style="min-width: 280px;">Issue</th>
            <th style="width: 240px;">Response / Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Dynamically Rendered -->
        </tbody>
      </table>
    </div>

    <!-- Kanban Board View -->
    <div id="kanbanView" class="kanban-grid" style="display: none;">
      <!-- Dynamically Rendered -->
    </div>

  </div>

  <!-- Response Discussion Modal -->
  <div id="chatModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <h3>💬 Discussion Thread</h3>
          <div id="chatIssueSubtitle" class="modal-subtitle">Issue text...</div>
        </div>
        <button id="closeChatModalBtn" class="modal-close-btn" title="Close modal">&times;</button>
      </div>
      
      <div id="chatThreadContainer" class="modal-body">
        <!-- Messages Dynamically Rendered -->
      </div>
      
      <div class="modal-footer">
        <div class="chat-input-wrapper">
          <textarea id="chatInput" placeholder="Type a message or resolution response..." rows="2"></textarea>
          <button id="sendChatBtn" class="btn btn-primary" title="Send message" style="height: 42px; width: 48px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
    </div>
  </div>


  <!-- Modular JavaScript Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
