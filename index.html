<!DOCTYPE html>
<html lang="en" data-theme="light" data-user="Anton">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Request Tracker & Issue Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="light"] {
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --bg-subtle: #f1f5f9;
      --bg-category: #e2e8f0;
      --border-color: #e2e8f0;
      --border-bright: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-glow: rgba(79, 70, 229, 0.15);
      
      --status-fixed-bg: #dcfce7;
      --status-fixed-text: #15803d;
      --status-fixed-border: #bbf7d0;

      --status-todo-bg: #fef3c7;
      --status-todo-text: #b45309;
      --status-todo-border: #fde68a;

      --status-backlog-bg: #dbeafe;
      --status-backlog-text: #1d4ed8;
      --status-backlog-border: #bfdbfe;

      --status-deprecated-bg: #f1f5f9;
      --status-deprecated-text: #475569;
      --status-deprecated-border: #cbd5e1;

      --prio-must-bg: #ffe4e6;
      --prio-must-text: #be123c;

      --prio-should-bg: #ffedd5;
      --prio-should-text: #c2410c;

      --prio-could-bg: #dcfce7;
      --prio-could-text: #15803d;

      --role-bg: #e0e7ff;
      --role-text: #3730a3;
      --category-text: #312e81;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --switcher-bg: #e2e8f0;
      --control-height: 36px;
    }

    :root[data-theme="dark"] {
      --bg-card: #111827;
      --bg-card-hover: #1f2937;
      --bg-subtle: #0f172a;
      --bg-category: #172033;
      --border-color: #1f293d;
      --border-bright: #374151;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.25);
      
      --status-fixed-bg: rgba(16, 185, 129, 0.15);
      --status-fixed-text: #34d399;
      --status-fixed-border: rgba(52, 211, 153, 0.3);

      --status-todo-bg: rgba(245, 158, 11, 0.15);
      --status-todo-text: #fbbf24;
      --status-todo-border: rgba(251, 191, 36, 0.3);

      --status-backlog-bg: rgba(59, 130, 246, 0.15);
      --status-backlog-text: #60a5fa;
      --status-backlog-border: rgba(96, 165, 250, 0.3);

      --status-deprecated-bg: rgba(107, 114, 128, 0.15);
      --status-deprecated-text: #9ca3af;
      --status-deprecated-border: rgba(156, 163, 175, 0.3);

      --prio-must-bg: rgba(244, 63, 94, 0.2);
      --prio-must-text: #fda4af;

      --prio-should-bg: rgba(249, 115, 22, 0.2);
      --prio-should-text: #fdba74;

      --prio-could-bg: rgba(34, 197, 94, 0.2);
      --prio-could-text: #86efac;

      --role-bg: rgba(255, 255, 255, 0.08);
      --role-text: #e5e7eb;
      --category-text: #a5b4fc;
      --card-shadow: none;
      --switcher-bg: #1f293d;
      --control-height: 36px;
    }

    /* Dynamic User Background Color Tints */
    :root[data-user="Anton"][data-theme="light"] {
      --bg-main: #f5f7ff;
      --bg-gradient-accent: rgba(99, 102, 241, 0.05);
    }
    :root[data-user="Anton"][data-theme="dark"] {
      --bg-main: #0c0f1f;
      --bg-gradient-accent: rgba(99, 102, 241, 0.1);
    }

    :root[data-user="Adonis"][data-theme="light"] {
      --bg-main: #f3faf6;
      --bg-gradient-accent: rgba(16, 185, 129, 0.05);
    }
    :root[data-user="Adonis"][data-theme="dark"] {
      --bg-main: #071310;
      --bg-gradient-accent: rgba(16, 185, 129, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      background-image: radial-gradient(circle at 50% 0%, var(--bg-gradient-accent) 0%, transparent 60%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 1.5rem 1.5rem;
      line-height: 1.5;
      transition: background-color 0.4s ease, background-image 0.4s ease, color 0.3s ease;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Streamlined Header */
    header {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: nowrap;
    }

    .title-area h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: nowrap;
    }

    /* Uniform Heights across controls */
    .user-switcher-container,
    .view-toggle,
    .btn {
      height: var(--control-height);
      box-sizing: border-box;
    }

    /* Segmented User Switcher */
    .user-switcher-container {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-bright);
      padding: 3px;
      border-radius: 30px;
      box-shadow: var(--card-shadow);
    }

    .user-pills {
      display: flex;
      height: 100%;
      background: var(--switcher-bg);
      border-radius: 24px;
      padding: 2px;
      gap: 2px;
    }

    .user-pill-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0 0.65rem;
      height: 100%;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .user-pill-btn:hover {
      color: var(--text-main);
    }

    .user-pill-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }

    .user-avatar-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: #ffffff;
    }

    .avatar-anton {
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
    }

    .avatar-adonis {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    /* Buttons */
    .btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-bright);
      padding: 0 0.85rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      box-shadow: var(--card-shadow);
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
      box-shadow: 0 3px 10px var(--primary-glow);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* View Switcher Toggle */
    .view-toggle {
      display: flex;
      align-items: center;
      background: var(--switcher-bg);
      border: 1px solid var(--border-bright);
      border-radius: 30px;
      padding: 3px;
      gap: 2px;
      box-shadow: var(--card-shadow);
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0 0.75rem;
      height: 100%;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s ease;
    }

    .view-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }

    /* Clickable Interactive Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: relative;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.08);
    }

    .stat-card.active {
      border-color: var(--primary);
      background: var(--bg-card-hover);
      box-shadow: 0 0 0 2px var(--primary-glow), var(--card-shadow);
    }

    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .stat-card:hover .stat-icon {
      transform: scale(1.08);
    }

    .stat-info .stat-value {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .stat-info .stat-label {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* Views: Table View */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    th {
      background: var(--bg-subtle);
      padding: 0.85rem 1rem;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
      vertical-align: top;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: var(--bg-card-hover);
    }

    /* Category Header Row in Table */
    tr.category-row td {
      background: var(--bg-category);
      font-weight: 700;
      font-size: 0.875rem;
      color: var(--category-text);
      border-top: 1px solid var(--border-bright);
      border-bottom: 1px solid var(--border-bright);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.725rem;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .badge-fixed {
      background: var(--status-fixed-bg);
      color: var(--status-fixed-text);
      border: 1px solid var(--status-fixed-border);
    }

    .badge-todo {
      background: var(--status-todo-bg);
      color: var(--status-todo-text);
      border: 1px solid var(--status-todo-border);
    }

    .badge-backlog {
      background: var(--status-backlog-bg);
      color: var(--status-backlog-text);
      border: 1px solid var(--status-backlog-border);
    }

    .badge-deprecated {
      background: var(--status-deprecated-bg);
      color: var(--status-deprecated-text);
      border: 1px solid var(--status-deprecated-border);
    }

    .badge-prio-must {
      background: var(--prio-must-bg);
      color: var(--prio-must-text);
    }

    .badge-prio-should {
      background: var(--prio-should-bg);
      color: var(--prio-should-text);
    }

    .badge-prio-could {
      background: var(--prio-could-bg);
      color: var(--prio-could-text);
    }

    .role-tag {
      display: inline-block;
      background: var(--role-bg);
      color: var(--role-text);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.775rem;
      font-weight: 600;
    }

    .text-response {
      color: var(--text-main);
      font-size: 0.85rem;
      margin-bottom: 0.2rem;
    }

    .text-notes {
      color: var(--text-muted);
      font-size: 0.775rem;
      font-style: italic;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    /* Views: Kanban Board */
    .kanban-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .kanban-col {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      height: 100%;
      box-shadow: var(--card-shadow);
    }

    .kanban-col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.75rem;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .kanban-col-title {
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .count-badge {
      background: var(--bg-subtle);
      color: var(--text-muted);
      padding: 0.12rem 0.45rem;
      border-radius: 10px;
      font-size: 0.725rem;
      font-weight: 600;
    }

    .kanban-cards {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow-y: auto;
      max-height: 70vh;
      padding-right: 2px;
    }

    .kanban-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .kanban-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-category {
      font-size: 0.725rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .card-issue {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.4;
    }

    .detail-box {
      background: var(--bg-card);
      border-left: 3px solid var(--primary);
      padding: 0.4rem 0.65rem;
      border-radius: 0 6px 6px 0;
      margin-top: 0.3rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    @media (max-width: 900px) {
      header {
        flex-wrap: wrap;
      }
      .header-actions {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="title-area">
        <h1>Purchase Request Tracker</h1>
      </div>
      <div class="header-actions">
        <!-- 1. User Switcher -->
        <div class="user-switcher-container">
          <div class="user-pills">
            <button class="user-pill-btn active" data-user="Anton">
              <span class="user-avatar-circle avatar-anton">An</span>
              <span>Anton</span>
            </button>
            <button class="user-pill-btn" data-user="Adonis">
              <span class="user-avatar-circle avatar-adonis">Ad</span>
              <span>Adonis</span>
            </button>
          </div>
        </div>

        <!-- 2. Light / Dark Theme Button -->
        <button class="btn" id="themeToggleBtn" title="Toggle Light/Dark Theme">
          <span id="themeIcon">☀️</span>
          <span id="themeText">Light</span>
        </button>

        <!-- 3. Export JSON Button -->
        <button class="btn btn-primary" id="exportBtn">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Export
        </button>

        <!-- 4. Table / Board View Switcher -->
        <div class="view-toggle">
          <button class="view-btn active" id="tableViewBtn">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm0 7h18v2H3v-2zm0 7h18v2H3v-2z"/></svg>
            <span>Table</span>
          </button>
          <button class="view-btn" id="kanbanViewBtn">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M4 4h4v16H4V4zm6 0h4v16h-4V4zm6 0h4v16h-4V4z"/></svg>
            <span>Board</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Clickable Interactive Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card active" data-filter="ALL" id="cardTotal">
        <div class="stat-icon" style="background: var(--role-bg); color: var(--primary);">📋</div>
        <div class="stat-info">
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">Total Items</div>
        </div>
      </div>
      <div class="stat-card" data-filter="Fixed" id="cardFixed">
        <div class="stat-icon" style="background: var(--status-fixed-bg); color: var(--status-fixed-text);">✅</div>
        <div class="stat-info">
          <div class="stat-value" id="statFixed">0</div>
          <div class="stat-label">Fixed</div>
        </div>
      </div>
      <div class="stat-card" data-filter="To Do" id="cardTodo">
        <div class="stat-icon" style="background: var(--status-todo-bg); color: var(--status-todo-text);">📌</div>
        <div class="stat-info">
          <div class="stat-value" id="statTodo">0</div>
          <div class="stat-label">To Do</div>
        </div>
      </div>
      <div class="stat-card" data-filter="Backlog" id="cardBacklog">
        <div class="stat-icon" style="background: var(--status-backlog-bg); color: var(--status-backlog-text);">⏳</div>
        <div class="stat-info">
          <div class="stat-value" id="statBacklog">0</div>
          <div class="stat-label">Backlog</div>
        </div>
      </div>
      <div class="stat-card" data-filter="Deprecated" id="cardDeprecated">
        <div class="stat-icon" style="background: var(--status-deprecated-bg); color: var(--status-deprecated-text);">🚫</div>
        <div class="stat-info">
          <div class="stat-value" id="statDeprecated">0</div>
          <div class="stat-label">Deprecated</div>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div id="tableView" class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 110px;">Status</th>
            <th style="width: 90px;">Priority</th>
            <th style="width: 70px;">Role</th>
            <th>Issue & Context</th>
            <th style="width: 320px;">Response / Resolution Notes</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Populated by JavaScript -->
        </tbody>
      </table>
    </div>

    <div id="kanbanView" class="kanban-grid" style="display: none;">
      <!-- Populated by JavaScript -->
    </div>
  </div>

  <script>

    // User Switcher & Dynamic Theme Setup
    let currentUser = "Anton";
    let currentFilter = "ALL";
    const userPills = document.querySelectorAll('.user-pill-btn');

    function applyUserTheme(userName) {
      document.documentElement.setAttribute('data-user', userName);
    }

    userPills.forEach(pill => {
      pill.addEventListener('click', () => {
        userPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentUser = pill.getAttribute('data-user');
        applyUserTheme(currentUser);
      });
    });

    // Helper functions for Badges
    function getStatusBadge(status) {
      if (!status) return '<span class="badge badge-deprecated">None</span>';
      const s = status.toLowerCase().replace(/\s+/g, '');
      if (s === 'fixed') return '<span class="badge badge-fixed">Fixed</span>';
      if (s === 'todo') return '<span class="badge badge-todo">To Do</span>';
      if (s === 'backlog') return '<span class="badge badge-backlog">Backlog</span>';
      if (s === 'deprecated') return '<span class="badge badge-deprecated">Deprecated</span>';
      return `<span class="badge badge-deprecated">${status}</span>`;
    }

    function getPriorityBadge(priority) {
      if (!priority) return '<span style="color: var(--text-dim); font-size: 0.75rem;">—</span>';
      const p = priority.toLowerCase();
      if (p === 'must') return '<span class="badge badge-prio-must">Must</span>';
      if (p === 'should') return '<span class="badge badge-prio-should">Should</span>';
      if (p === 'could') return '<span class="badge badge-prio-could">Could</span>';
      return `<span class="badge">${priority}</span>`;
    }

    // Render Statistics
    function updateStats(data) {
      document.getElementById('statTotal').textContent = data.length;
      document.getElementById('statFixed').textContent = data.filter(d => d.status === 'Fixed').length;
      document.getElementById('statTodo').textContent = data.filter(d => d.status === 'To Do').length;
      document.getElementById('statBacklog').textContent = data.filter(d => d.status === 'Backlog').length;
      document.getElementById('statDeprecated').textContent = data.filter(d => d.status === 'Deprecated').length;
    }

    // Get Filtered Dataset
    function getFilteredData() {
      if (currentFilter === 'ALL') return dataset;
      return dataset.filter(item => item.status === currentFilter);
    }

    // Render Table View
    function renderTableView(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--text-muted);">No items match the selected filter.</td></tr>`;
        return;
      }

      let currentCategory = '';
      data.forEach(item => {
        if (item.category !== currentCategory) {
          currentCategory = item.category;
          const catRow = document.createElement('tr');
          catRow.className = 'category-row';
          catRow.innerHTML = `<td colspan="5">📂 ${currentCategory}</td>`;
          tbody.appendChild(catRow);
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${getStatusBadge(item.status)}</td>
          <td>${getPriorityBadge(item.priority)}</td>
          <td>${item.role ? `<span class="role-tag">${item.role}</span>` : '<span style="color: var(--text-dim); font-size: 0.75rem;">—</span>'}</td>
          <td style="font-weight: 500; color: var(--text-main);">${item.issue || ''}</td>
          <td>
            ${item.response ? `<div class="text-response">${item.response}</div>` : ''}
            ${item.notes ? `<div class="text-notes">💬 ${item.notes}</div>` : ''}
            ${!item.response && !item.notes ? '<span style="color: var(--text-dim); font-size: 0.75rem;">—</span>' : ''}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Render Kanban View
    function renderKanbanView(data) {
      const kanbanGrid = document.getElementById('kanbanView');
      kanbanGrid.innerHTML = '';

      const columns = currentFilter === 'ALL' 
        ? ['Fixed', 'To Do', 'Backlog', 'Deprecated'] 
        : [currentFilter];
      
      columns.forEach(colStatus => {
        const colData = data.filter(d => d.status === colStatus);
        
        const colEl = document.createElement('div');
        colEl.className = 'kanban-col';

        let badgeHtml = getStatusBadge(colStatus);

        colEl.innerHTML = `
          <div class="kanban-col-header">
            <div class="kanban-col-title">
              ${badgeHtml}
            </div>
            <span class="count-badge">${colData.length}</span>
          </div>
          <div class="kanban-cards">
            ${colData.length === 0 ? '<div style="color: var(--text-dim); font-size: 0.8rem; text-align: center; padding: 1.5rem 0;">No items</div>' : ''}
            ${colData.map(item => `
              <div class="kanban-card">
                <div class="card-meta">
                  <span class="card-category">${item.category}</span>
                  ${getPriorityBadge(item.priority)}
                </div>
                <div class="card-issue">${item.issue}</div>
                ${item.role ? `<div><span class="role-tag">${item.role}</span></div>` : ''}
                ${item.response || item.notes ? `
                  <div class="detail-box">
                    ${item.response ? `<div style="font-size: 0.8rem; color: var(--text-main); font-weight: 500;">${item.response}</div>` : ''}
                    ${item.notes ? `<div style="font-size: 0.75rem; color: var(--text-muted); font-style: italic; margin-top: 2px;">💬 ${item.notes}</div>` : ''}
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        `;

        kanbanGrid.appendChild(colEl);
      });
    }

    function render() {
      updateStats(dataset);
      const filtered = getFilteredData();
      renderTableView(filtered);
      renderKanbanView(filtered);
    }

    // Stat Cards Interactive Filtering
    const statCards = document.querySelectorAll('.stat-card');
    statCards.forEach(card => {
      card.addEventListener('click', () => {
        const targetFilter = card.getAttribute('data-filter');
        
        // If clicking already active filter card (except Total), reset to ALL
        if (currentFilter === targetFilter && targetFilter !== 'ALL') {
          currentFilter = 'ALL';
        } else {
          currentFilter = targetFilter;
        }

        // Highlight active stat card
        statCards.forEach(c => {
          if (c.getAttribute('data-filter') === currentFilter) {
            c.classList.add('active');
          } else {
            c.classList.remove('active');
          }
        });

        render();
      });
    });

    // View Switcher (Table vs Board)
    const tableBtn = document.getElementById('tableViewBtn');
    const kanbanBtn = document.getElementById('kanbanViewBtn');
    const tableView = document.getElementById('tableView');
    const kanbanView = document.getElementById('kanbanView');

    tableBtn.addEventListener('click', () => {
      tableBtn.classList.add('active');
      kanbanBtn.classList.remove('active');
      tableView.style.display = 'block';
      kanbanView.style.display = 'none';
    });

    kanbanBtn.addEventListener('click', () => {
      kanbanBtn.classList.add('active');
      tableBtn.classList.remove('active');
      tableView.style.display = 'none';
      kanbanView.style.display = 'grid';
    });

    // Theme Toggle Logic
    const themeBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    themeBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);

      if (newTheme === 'dark') {
        themeIcon.textContent = '🌙';
        themeText.textContent = 'Dark';
      } else {
        themeIcon.textContent = '☀️';
        themeText.textContent = 'Light';
      }
    });

    // Export Functionality
    document.getElementById('exportBtn').addEventListener('click', () => {
      const exportObject = {
        currentUser: currentUser,
        activeFilter: currentFilter,
        exportedAt: new Date().toISOString(),
        items: getFilteredData()
      };
      const blob = new Blob([JSON.stringify(exportObject, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `purchase_requests_${currentUser.toLowerCase()}_${currentFilter.toLowerCase()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Initial render & theme setup
    applyUserTheme(currentUser);
    render();
  </script>
